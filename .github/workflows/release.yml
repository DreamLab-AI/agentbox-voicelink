name: release

# Pushing a tag `v*` builds three plain binaries with the default features and
# attaches voicelink-<target>.tar.gz plus a .sha256 file to a GitHub release:
#
#   x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-apple-darwin
#
# Each tarball holds voicelink, agentbox-remote, the licences, README.md and
# compose/ (the optional Docker model stack); the setup wizard looks for
# compose/compose.yml next to the binary. No inference engine is built in:
# voicelink reaches every model over HTTP, so there are no GPU legs and no GPU
# SDKs here.
#
# macOS binaries are UNSIGNED and not notarised. After downloading, Gatekeeper
# quarantines them; clear it with:
#     xattr -d com.apple.quarantine voicelink agentbox-remote

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  create:
    name: create draft release
    runs-on: ubuntu-latest
    steps:
      # Created once, before the matrix, so the legs cannot race to create it.
      - run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes

  build:
    name: build ${{ matrix.target }}
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Linux build packages
        if: runner.os == 'Linux'
        # libasound2-dev: cpal (the audio-io feature).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p voicelink --bin voicelink --bin agentbox-remote
      - name: Package
        id: pack
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="voicelink-${TARGET}"
          mkdir "$name"
          cp "target/${TARGET}/release/voicelink" "target/${TARGET}/release/agentbox-remote" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          cp -R compose "$name/compose"
          tar -czf "${name}.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"; else shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"; fi
          cat "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - name: Upload to the release
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: gh release upload "$TAG" "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" --clobber

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --draft=false
