name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: fmt, clippy, test, doc (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: System packages
        # libasound2-dev: cpal on Linux. tmux: the tmux-control and voice-paned
        # tests start their own private tmux servers.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev tmux
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Documentation of the published crates
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p voicelink-proto -p tmux-control -p voicelink-backends
      - name: Documentation of the client
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p voicelink

  macos:
    name: build check (macOS, Apple silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --workspace --all-targets
