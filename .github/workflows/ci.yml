name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: fmt, clippy, test, doc (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: System packages
        # libasound2-dev: cpal on Linux. tmux: the tmux-control and voice-paned
        # tests start their own private tmux servers.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev tmux
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Documentation of the published crates
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p voicelink-proto -p tmux-control -p voicelink-backends
      - name: Documentation of the client
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p voicelink

  msrv:
    name: MSRV (rust-version 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to the 1.88 toolchain, the workspace `rust-version`: a newer
      # language or std feature fails here instead of for a downstream user.
      # No ALSA headers needed: the audio backend is off.
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # branch 1.88.0
        with:
          toolchain: 1.88.0
      - run: cargo check --workspace --no-default-features --locked

  msrv-backends:
    name: MSRV of voicelink-backends (rust-version 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The published crate declares 1.85 (edition 2024 plus its dependency set),
      # lower than the workspace, so it is checked on its own.
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check -p voicelink-backends --locked

  headless:
    name: voice-paned tests without X11 or ALSA (the agentbox Nix build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - name: The hotkey feature must stay out of voice-paned's test closure
        run: |
          if cargo tree -p voice-paned --no-default-features -e normal,dev | grep -iE 'global-hotkey|x11|xkb'; then
            echo "voice-paned's tests pull the hotkey crates again" >&2
            exit 1
          fi
      - run: cargo test -p voice-paned --no-default-features --locked

  macos:
    name: build check (macOS, Apple silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --workspace --all-targets
