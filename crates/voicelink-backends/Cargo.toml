[package]
name = "voicelink-backends"
version = "0.1.0"
description = "Speech-to-text, tool-calling chat and text-to-speech clients for OpenAI-compatible and Nemotron servers, with reachability probes"
readme = "README.md"
keywords = ["speech", "stt", "tts", "llm", "openai"]
categories = ["multimedia::audio", "api-bindings"]
edition.workspace = true
# Derived: edition 2024 needs 1.85 and no dependency in the lock file asks for more.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rmp-serde = "1"
rubato = "0.16"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "multipart", "ws"] }

[lints]
workspace = true
